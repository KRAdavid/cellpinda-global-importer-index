name: Apply Public Drive API Key Mode

on:
  push:
    branches:
      - feature/public-drive-api-key-sync
    paths:
      - bootstrap/public-api-key-patch/**
      - .github/workflows/apply-public-drive-api-key.yml
  pull_request:
    branches:
      - main
    paths:
      - bootstrap/public-api-key-patch/**
      - .github/workflows/apply-public-drive-api-key.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/public-drive-api-key-sync
          fetch-depth: 0

      - name: Reconstruct and apply patch
        shell: bash
        run: |
          set -euo pipefail
          test -d bootstrap/public-api-key-patch
          cat bootstrap/public-api-key-patch/part-* | base64 --decode > /tmp/public-drive-api-key.patch
          git apply --check /tmp/public-drive-api-key.patch
          git apply /tmp/public-drive-api-key.patch
          node --check scripts/sync-drive.mjs
          node scripts/sync-drive.mjs --self-test

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap/public-api-key-patch
          git config user.name "cellpinda-index-bootstrap"
          git config user.email "cellpinda-index-bootstrap@users.noreply.github.com"
          git add -A
          git commit -m "feat: support public Drive API key synchronization"
          git push origin HEAD:feature/public-drive-api-key-sync
