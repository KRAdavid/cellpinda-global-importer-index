name: Sync Google Drive Index

on:
  schedule:
    # 22:15 UTC = 07:15 Asia/Seoul on the following calendar day.
    - cron: "15 22 * * *"
  workflow_dispatch:
    inputs:
      verify_public_links:
        description: "Check public download links during this run"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: google-drive-index-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: automation/google-drive-index
  GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
  OPENAI_MAX_DOCUMENTS: ${{ vars.OPENAI_MAX_DOCUMENTS || '20' }}
  VERIFY_PUBLIC_LINKS: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_public_links || vars.VERIFY_PUBLIC_LINKS || 'false' }}

jobs:
  sync:
    name: Read Drive, validate, build and update PR
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check required configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_DRIVE_ROOT_FOLDER_ID}" ]]; then
            echo "::error::Missing repository secret GOOGLE_DRIVE_ROOT_FOLDER_ID"
            exit 1
          fi
          if [[ -z "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]]; then
            echo "::error::Missing repository secret GOOGLE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Drive index
        run: npm run sync:drive

      - name: Validate generated index
        run: npm run validate

      - name: Test Drive classification rules
        run: npm run test:sync-rules

      - name: Build static site before publishing changes
        run: npm run build

      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/data/index.json public/data/status.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated index changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- public/data/index.json public/data/status.json
          fi

      - name: Commit and push automation branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cellpinda-index-bot"
          git config user.email "cellpinda-index-bot@users.noreply.github.com"
          git fetch origin "${SYNC_BRANCH}" || true
          git checkout -B "${SYNC_BRANCH}"
          git add public/data/index.json public/data/status.json
          git commit -m "chore: sync public Google Drive index"
          git push --force-with-lease --set-upstream origin "${SYNC_BRANCH}"

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PR_URL="$(gh pr list --head "${SYNC_BRANCH}" --base main --state open --json url --jq '.[0].url // empty')"
          if [[ -z "${PR_URL}" ]]; then
            cat > /tmp/pr-body.md <<'BODY'
          ## Google Drive public-index synchronization

          This automated pull request updates the generated public document index from the configured Google Drive data room.

          ### Controls applied
          - indexes only files with an `anyone` public permission
          - excludes private and restricted files
          - classifies records from the approved folder structure and optional Drive description metadata
          - archives expired records when an expiry date is available
          - validates the JSON schema and completes a production static build before pushing
          - uses OpenAI metadata assistance only when `OPENAI_API_KEY` is configured

          The original files remain in Google Drive. This PR changes generated metadata files only.
          BODY
            PR_URL="$(gh pr create \
              --base main \
              --head "${SYNC_BRANCH}" \
              --title "chore: sync public Google Drive index" \
              --body-file /tmp/pr-body.md)"
          else
            gh pr edit "${PR_URL}" --title "chore: sync public Google Drive index"
          fi
          echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "Pull request: ${PR_URL}"

      - name: Enable automatic merge when configured
        if: steps.changes.outputs.changed == 'true' && vars.AUTO_MERGE_DRIVE_INDEX == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pull_request.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${PR_URL}" --squash --auto || gh pr merge "${PR_URL}" --squash
