name: Validate and Build

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "automation/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, test and build static site
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create source archive for implementation work
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=out \
            --exclude=.next \
            --exclude=test-results \
            --exclude=playwright-report \
            -czf "${RUNNER_TEMP}/cellpinda-source-bundle.tar.gz" .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: cellpinda-source-bundle
          path: ${{ runner.temp }}/cellpinda-source-bundle.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Apps Script feed source
        shell: bash
        run: |
          set -euo pipefail
          cp apps-script/Code.gs /tmp/cellpinda-drive-feed.js
          node --check /tmp/cellpinda-drive-feed.js
          node -e "JSON.parse(require('node:fs').readFileSync('apps-script/appsscript.json', 'utf8'))"

      - name: Validate source document index
        run: npm run validate

      - name: Test public-feed classification rules
        run: npm run test:sync-rules

      - name: Build and validate Guided AI static site
        run: npm run build

      - name: Install Chromium for responsive browser tests
        run: npx playwright install --with-deps chromium

      - name: Test desktop, mobile and Guided AI interactions
        run: npm run test:e2e

      - name: Verify static export
        run: |
          test -f out/index.html
          test -f out/data/index.json
          test -f out/data/search-index.json
          test -f out/data/status.json
          test -f out/document-center/index.html
          test -f out/ask-cellpinda/index.html
          echo "Static export verified."

      - name: Upload static build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cellpinda-global-index-static-site
          path: out
          if-no-files-found: error
          retention-days: 7
