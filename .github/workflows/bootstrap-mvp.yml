name: Bootstrap Cellpinda Global Index MVP

on:
  push:
    branches:
      - feature/google-drive-index-v1
    paths:
      - .github/workflows/bootstrap-mvp.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-cellpinda-global-index
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/google-drive-index-v1
          fetch-depth: 0

      - name: Validate bootstrap parts
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/READY
          for file in bootstrap/part-*; do
            clean_file="$(mktemp)"
            tr -d '[:space:]' < "$file" > "$clean_file"
            raw_bytes="$(wc -c < "$file" | tr -d ' ')"
            clean_bytes="$(wc -c < "$clean_file" | tr -d ' ')"
            echo "$file raw=$raw_bytes clean=$clean_bytes remainder=$((clean_bytes % 4))"
            if LC_ALL=C grep -n '[^A-Za-z0-9+/=]' "$clean_file"; then
              echo "::error file=$file::Non-base64 characters detected"
              exit 1
            fi
            if ! base64 --decode "$clean_file" > /dev/null 2>&1; then
              echo "::error file=$file::Base64 decoding failed"
              exit 1
            fi
            rm -f "$clean_file"
          done

      - name: Reconstruct and verify MVP archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-* | tr -d '[:space:]' | base64 --decode > /tmp/cellpinda-mvp.zip
          echo "facc647f40bfa6e45edeb2d36e86ed263fe07d04f39316653e7ae1228e4aa5e3  /tmp/cellpinda-mvp.zip" | sha256sum -c -
          unzip -t /tmp/cellpinda-mvp.zip

      - name: Replace bootstrap payload with MVP source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cellpinda-mvp
          mkdir -p /tmp/cellpinda-mvp
          unzip -q /tmp/cellpinda-mvp.zip -d /tmp/cellpinda-mvp
          test -f /tmp/cellpinda-mvp/cellpinda-global-importer-index/package.json
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/cellpinda-mvp/cellpinda-global-importer-index/ ./

      - name: Commit complete MVP source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cellpinda-index-bootstrap"
          git config user.email "cellpinda-index-bootstrap@users.noreply.github.com"
          git add -A
          git commit -m "feat: build Google Drive importer index MVP"
          git push origin HEAD:feature/google-drive-index-v1
