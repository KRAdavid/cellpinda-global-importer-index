name: Validate and Build

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "automation/**"

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Apply, validate and build Guided AI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: feature/ask-cellpinda-guided-ai-v1
          fetch-depth: 0

      - name: Verify and apply staged implementation
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .automation/ask-guided-ai.part.00 ]]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          declare -A EXPECTED=(
            [00]="4bbaf2da1d7800e262fea8a7a447fd04ba476248340e5352a0dc5d2921510798"
            [01]="06c6ce1acbe05b1a2822e12ad2cb10a2764e7dc670e23b135841b4399def6b15"
            [02]="37ca1b126ab8faff2d98b7851226508ad28aa8c776bc5d6d94e7b7e724fc0de6"
            [03]="2c875c330a015479ea76d5f5dc5b70163f66583297406957f33ec2182d145a19"
            [04]="be04bb082ef06614674efc90b2c2a9cc29ddc8822a40df3c953922443b2562e2"
            [05]="9ee70f3109c5c6b569a59b3cfd8830d4e4a56dc22e30c56c0a70b81c1914e99c"
            [06]="e59f85edc786b4e00ba938d50b3762202e8fd62974eec46523ff59130803f076"
          )

          for part in 00 01 02 03 04 05 06; do
            tr -d '[:space:]' < ".automation/ask-guided-ai.part.${part}" > "/tmp/part.${part}"
            echo "${EXPECTED[$part]}  /tmp/part.${part}" | sha256sum -c -
          done

          cat /tmp/part.?? > /tmp/ask-guided-ai.tar.gz.b64
          base64 --decode /tmp/ask-guided-ai.tar.gz.b64 > /tmp/ask-guided-ai.tar.gz
          echo "19fe0ba3a3cb75b83949e2b43014c89ce5d836082893891f49b3f46d40e1d974  /tmp/ask-guided-ai.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ask-guided-ai.tar.gz -C .

          rm -f .automation/ask-guided-ai.part.*
          rm -f .automation/apply-guided-ai.trigger
          rm -f .github/workflows/apply-ask-cellpinda.yml
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Validate Apps Script feed source
        shell: bash
        run: |
          set -euo pipefail
          cp apps-script/Code.gs /tmp/cellpinda-drive-feed.js
          node --check /tmp/cellpinda-drive-feed.js
          node -e "JSON.parse(require('node:fs').readFileSync('apps-script/appsscript.json', 'utf8'))"

      - name: Validate source index
        run: npm run validate

      - name: Test public-feed classification rules
        run: npm run test:sync-rules

      - name: Build static site
        run: npm run build

      - name: Install Chromium for browser validation
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile Guided AI tests
        run: npm run test:e2e

      - name: Verify static export
        run: |
          test -f out/index.html
          test -f out/data/index.json
          test -f out/data/search-index.json
          test -f out/data/status.json
          test -f out/ask-cellpinda/index.html
          test -f out/document-center/index.html
          echo "Static export verified."

      - name: Commit verified implementation
        if: steps.payload.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cellpinda-development-bot"
          git config user.email "cellpinda-development-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add Ask Cellpinda Guided AI v1"
          git push origin HEAD:feature/ask-cellpinda-guided-ai-v1

      - name: Upload static build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cellpinda-global-index-static-site
          path: out
          if-no-files-found: error
          retention-days: 7
