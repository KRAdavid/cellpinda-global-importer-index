name: Apply production readiness implementation

on:
  push:
    branches:
      - feature/public-site-production-readiness-v1
    paths:
      - ".automation/apply-production-readiness.trigger"
  pull_request:
    branches:
      - main
    paths:
      - ".automation/apply-production-readiness.trigger"

permissions:
  contents: write

concurrency:
  group: apply-production-readiness
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: feature/public-site-production-readiness-v1
          fetch-depth: 0

      - name: Verify and extract production-readiness source bundle
        id: payload
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f .automation/apply-production-readiness.trigger ]]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "Production-readiness payload was already applied."
            exit 0
          fi

          declare -A EXPECTED=(
            [00]="aa5138178797413aae53c806c56fd092d26352dc496a2f0dfb5b174dc852681f"
            [01]="33ea44c56afd04f8b2bb2fcdb0426f67dde00503830f2558f97fda1527716829"
            [02]="e50480b69c86f14f200e9c5e6a7d95327bc08a576d8612f48a076b7526ce832f"
            [03]="37bd61a9c127b5136886c8c515a83adbd517d36322febc1577d149187f141885"
            [04]="daa4872e9fd14683fdbee5085b43b47d9cf7aadf8647dd6dd2d629fae2f2998b"
            [05]="1d17ace0459edfa561e72df93a846fb6a4af99cbd5927028f6693244e4831de3"
            [06]="0412390a2bca264a5f8eab8f148e3cce38bc641ed77701030baaa78315e73f9f"
            [07]="2fa0a68889b7a942ac815590b21aa8c345a7f99d189095de812e10f4fef1e1c1"
          )

          for part in 00 01 02 03 04 05 06 07; do
            tr -d '[:space:]' < ".automation/production-source.part.${part}" > "/tmp/production-source.part.${part}"
            echo "${EXPECTED[$part]}  /tmp/production-source.part.${part}" | sha256sum -c -
          done

          cat /tmp/production-source.part.?? > /tmp/cellpinda-production-source.tar.gz.b64
          echo "e57f8919c025358c92e052e86372bfd24bc3da4c1aab480558d7aa46588f1b2b  /tmp/cellpinda-production-source.tar.gz.b64" | sha256sum -c -

          base64 --decode /tmp/cellpinda-production-source.tar.gz.b64 > /tmp/cellpinda-production-source.tar.gz
          echo "3de3beb65382c098757806fc5b12b34b895065823d3a10423c22acf2b1542680  /tmp/cellpinda-production-source.tar.gz" | sha256sum -c -

          rm -f public/robots.txt
          tar -xzf /tmp/cellpinda-production-source.tar.gz -C .
          rm -f public/robots.txt
          rm -f .automation/production-source.part.*
          rm -f .automation/apply-production-readiness.trigger
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.payload.outputs.applied == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.payload.outputs.applied == 'true'
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Validate Apps Script feed source
        if: steps.payload.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp apps-script/Code.gs /tmp/cellpinda-drive-feed.js
          node --check /tmp/cellpinda-drive-feed.js
          node -e "JSON.parse(require('node:fs').readFileSync('apps-script/appsscript.json', 'utf8'))"

      - name: Validate source document index
        if: steps.payload.outputs.applied == 'true'
        run: npm run validate

      - name: Test public-feed classification rules
        if: steps.payload.outputs.applied == 'true'
        run: npm run test:sync-rules

      - name: Test final-site health-check rules
        if: steps.payload.outputs.applied == 'true'
        run: npm run test:public-site

      - name: Build production-readiness static site
        if: steps.payload.outputs.applied == 'true'
        run: npm run build

      - name: Install Chromium for responsive browser tests
        if: steps.payload.outputs.applied == 'true'
        run: npx playwright install --with-deps chromium

      - name: Test desktop, mobile, inquiry and Guided AI interactions
        if: steps.payload.outputs.applied == 'true'
        run: npm run test:e2e

      - name: Verify static export
        if: steps.payload.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/data/index.json
          test -f out/data/search-index.json
          test -f out/data/status.json
          test -f out/data/readiness.json
          test -f out/data/deployment.json
          test -f out/document-center/index.html
          test -f out/ask-cellpinda/index.html
          test -f out/importer-inquiry/index.html
          test -f out/privacy/index.html
          test -f out/system-status/index.html
          test -f out/sitemap.xml
          test -f out/robots.txt
          grep -q 'Cellpinda' out/index.html
          grep -q 'Importer inquiry' out/importer-inquiry/index.html
          echo "Production-readiness static export verified."

      - name: Commit verified source implementation
        if: steps.payload.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cellpinda-development-bot"
          git config user.email "cellpinda-development-bot@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows
          git diff --cached --check
          git commit -m "feat: make public site production-ready"
          git push origin HEAD:feature/public-site-production-readiness-v1

      - name: Upload verified static build artifact
        if: steps.payload.outputs.applied == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cellpinda-production-readiness-static-site
          path: out
          if-no-files-found: error
          retention-days: 7
