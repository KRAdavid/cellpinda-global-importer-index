name: Apply Apps Script Public Feed Implementation

on:
  push:
    branches:
      - feature/apps-script-public-feed
    paths:
      - bootstrap/apps-script-feed/**
      - .github/workflows/apply-apps-script-public-feed.yml

permissions:
  contents: write

concurrency:
  group: apply-apps-script-public-feed
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/apps-script-public-feed
          fetch-depth: 0

      - name: Reconstruct and verify implementation payload
        shell: bash
        run: |
          set -euo pipefail
          test -d bootstrap/apps-script-feed
          cat bootstrap/apps-script-feed/part-* | base64 --decode > /tmp/apps-script-feed.zip
          echo "44dfafde7885e0f8df7e50849124b6913087e210dbd98113b14e22936ed36b51  /tmp/apps-script-feed.zip" | sha256sum -c -
          unzip -t /tmp/apps-script-feed.zip

      - name: Apply implementation files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/apps-script-feed
          mkdir -p /tmp/apps-script-feed
          unzip -q /tmp/apps-script-feed.zip -d /tmp/apps-script-feed
          install -D -m 0644 /tmp/apps-script-feed/.env.example .env.example
          install -D -m 0644 /tmp/apps-script-feed/package.json package.json
          install -D -m 0644 /tmp/apps-script-feed/README.md README.md
          install -D -m 0644 /tmp/apps-script-feed/SETUP_GUIDE_KO.md SETUP_GUIDE_KO.md
          install -D -m 0755 /tmp/apps-script-feed/scripts/sync-public-feed.mjs scripts/sync-public-feed.mjs
          install -D -m 0644 /tmp/apps-script-feed/apps-script/Code.gs apps-script/Code.gs
          install -D -m 0644 /tmp/apps-script-feed/apps-script/appsscript.json apps-script/appsscript.json
          install -D -m 0644 /tmp/apps-script-feed/apps-script/README_KO.md apps-script/README_KO.md
          rm -rf bootstrap/apps-script-feed
          node --check scripts/sync-public-feed.mjs
          node scripts/sync-public-feed.mjs --self-test

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cellpinda-index-bootstrap"
          git config user.email "cellpinda-index-bootstrap@users.noreply.github.com"
          git add .env.example package.json README.md SETUP_GUIDE_KO.md scripts/sync-public-feed.mjs apps-script bootstrap/apps-script-feed
          git commit -m "feat: add no-Cloud-Console Apps Script Drive feed"
          git push origin HEAD:feature/apps-script-public-feed
