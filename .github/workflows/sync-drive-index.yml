name: Sync Google Drive Index

on:
  schedule:
    - cron: "15 22 * * *" # 07:15 Asia/Seoul
  workflow_dispatch:
    inputs:
      verify_public_links:
        description: "Check public download links during this run"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: google-drive-index-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: automation/google-drive-index
  GOOGLE_DRIVE_ROOT_FOLDER_ID: "1f7GoC25SGkIyRZa85qGdbmf0Rb0Pkde6"
  GOOGLE_DRIVE_FEED_URL: ${{ vars.GOOGLE_DRIVE_FEED_URL }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
  OPENAI_MAX_DOCUMENTS: ${{ vars.OPENAI_MAX_DOCUMENTS || '20' }}
  VERIFY_PUBLIC_LINKS: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_public_links || vars.VERIFY_PUBLIC_LINKS || 'false' }}

jobs:
  sync:
    name: Read Apps Script feed, validate, build and update PR
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check required configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_DRIVE_FEED_URL}" ]]; then
            echo "::error::Missing repository variable GOOGLE_DRIVE_FEED_URL"
            exit 1
          fi
          if [[ "${GOOGLE_DRIVE_FEED_URL}" != https://script.google.com/macros/s/*/exec* ]]; then
            echo "::error::GOOGLE_DRIVE_FEED_URL must be an Apps Script /exec URL"
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Drive index from public feed
        run: npm run sync:drive

      - name: Validate generated index
        run: npm run validate

      - name: Test feed classification rules
        run: npm run test:sync-rules

      - name: Build static site
        run: npm run build

      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/data/index.json public/data/status.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated index changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- public/data/index.json public/data/status.json
          fi

      - name: Commit and push automation branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cellpinda-index-bot"
          git config user.email "cellpinda-index-bot@users.noreply.github.com"
          git fetch origin "${SYNC_BRANCH}" || true
          git checkout -B "${SYNC_BRANCH}"
          git add public/data/index.json public/data/status.json
          git commit -m "chore: sync public Google Drive index"
          git push --force-with-lease --set-upstream origin "${SYNC_BRANCH}"

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PR_URL="$(gh pr list --head "${SYNC_BRANCH}" --base main --state open --json url --jq '.[0].url // empty')"
          if [[ -z "${PR_URL}" ]]; then
            PR_URL="$(gh pr create \
              --base main \
              --head "${SYNC_BRANCH}" \
              --title "chore: sync public Google Drive index" \
              --body "Automated public metadata update from the Cellpinda Apps Script Drive feed. Original files remain in Google Drive.")"
          else
            gh pr edit "${PR_URL}" --title "chore: sync public Google Drive index"
          fi
          echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "Pull request: ${PR_URL}"

      - name: Enable automatic merge when configured
        if: steps.changes.outputs.changed == 'true' && vars.AUTO_MERGE_DRIVE_INDEX == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pull_request.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${PR_URL}" --squash --auto || gh pr merge "${PR_URL}" --squash
